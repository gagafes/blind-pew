name: Publish Blind Pew

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful Test and build Blind Pew run ID for this main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-blind-pew
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'gagafes/blind-pew' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify, upload and publish the approved release
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: python3 .github/scripts/publish-release.py

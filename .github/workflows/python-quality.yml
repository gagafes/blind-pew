# Continuous checks for changes, manual dispatch, and weekly vulnerability refresh.
name: Python quality and security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: python-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-analysis:
    name: Ruff, Bandit and Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/python-quality.yml
      - name: Install analysis tools
        run: python -m pip install 'ruff>=0.15,<1' 'bandit>=1.8,<2' 'semgrep>=1.140,<2'
      - name: Ruff (syntax and correctness rules)
        run: ruff check --select E9,F blind_pew tools tests .github/scripts
      - name: Bandit (medium/high confidence and severity)
        run: bandit -r blind_pew tools .github/scripts -ll -ii
      - name: Semgrep (error-severity security rules)
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: semgrep scan --config p/python --config p/security-audit --severity ERROR --error --metrics=off blind_pew tools .github/scripts

  dependencies:
    name: pip-audit (PyPI dependency inventory)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/python-quality.yml
      - name: Install pip-audit
        run: python -m pip install 'pip-audit>=2.9,<3'
      - name: Audit PyPI dependencies
        run: |
          # Blind Pew declares no pip/PyPI runtime requirements. Its Python
          # bindings and desktop dependencies are provided by Debian/Ubuntu APT.
          # This explicit empty inventory is audited to catch future additions
          # once tracked here; APT security updates remain a separate concern.
          printf '%s\n' '# No PyPI runtime dependencies; see README.md (Dependencies).' > /tmp/blind-pew-pypi-requirements.txt
          pip-audit -r /tmp/blind-pew-pypi-requirements.txt
          echo 'No PyPI runtime dependencies; OS packages are outside pip-audit scope.' >> "$GITHUB_STEP_SUMMARY"

  pytest:
    name: pytest (unit regressions)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install distro-native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pytest python3-gi gir1.2-ibus-1.0 gir1.2-gtk-3.0 gir1.2-gtk-4.0
      - name: Run existing unittest suites through pytest
        run: /usr/bin/python3 -m pytest -q tests/test_*.py

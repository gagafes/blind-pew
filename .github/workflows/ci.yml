name: Test and build Blind Pew

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi libglib2.0-bin gir1.2-ibus-1.0 gir1.2-gtk-3.0 gir1.2-gtk-4.0 gir1.2-ayatanaappindicator3-0.1 ibus ibus-gtk3 ibus-gtk4 im-config xfconf xvfb dbus-x11 desktop-file-utils
      - name: Test
        run: |
          /usr/bin/python3 -m unittest discover -s tests -v
          sh tests/run_protocol_smoke.sh
          /usr/bin/python3 tests/run_gui_smoke.py
          /usr/bin/python3 tests/run_gui_smoke.py tests/about_smoke.py
          /usr/bin/python3 tests/run_gui_smoke.py tests/hotkey_smoke.py
          /usr/bin/python3 tests/run_gui_smoke.py tests/desktop_smoke.py
          /usr/bin/python3 tests/run_gui_smoke.py tests/gtk4_module_smoke.py
          desktop-file-validate assets/blind-pew.desktop
          node --input-type=module --check < assets/gnome-extension/extension.js
      - name: Build DEB
        run: /usr/bin/python3 tools/build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: blind-pew-deb
          path: dist/*.deb
          if-no-files-found: error
